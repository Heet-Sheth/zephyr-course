# Available runners configured by board.cmake.
runners:
- qemu

# Default flash runner if --runner is not given.
flash-runner: qemu

# Default debug runner if --runner is not given.
debug-runner: qemu

# Common runner configuration values.
config:
  board_dir: /Users/heet/Zephyr/deps/zephyr/boards/qemu/cortex_m3
  # Build outputs:
  elf_file: zephyr.elf
  # Host tools:
  gdb: /Users/heet/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /Users/heet/zephyr-sdk-1.0.1/hosttools/usr/bin/openocd
  openocd_search:
    - /Users/heet/zephyr-sdk-1.0.1/hosttools/opt/openocd/share/openocd/scripts

# Runner specific arguments
args:
  qemu:
    []

